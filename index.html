            if (!item.performance || item.status !== 'Posted') return { score: 0, label: 'UNRANKED', isWinner: false };

            const viewScore = (p.views || 0) / 100;
            const commentScore = (p.comments || 0) * 3;
            const shareScore = (p.shares || 0) * 4;
            const saveScore = (p.saves || 0) * 3.5;
            const visitScore = (p.profileVisits || 0) * 2;

            let isWinner = false;

              isWinner = true;
            } else if (totalRaw > 75) {

                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-500">Skema Kolom Terpetakan:</span>
                        <span className="font-mono text-[10px] text-gray-700">A (ID) s/d AS (Last Updated)</span>
                      </div>
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        const fd = new FormData(e.target);
                        setSheetConfig(prev => ({
                          ...prev,
                          apiUrl: fd.get('apiUrl'),
                          sheetId: fd.get('sheetId'),
                          sheetName: fd.get('sheetName'),
                          autoSync: !!fd.get('autoSync')
                        }));
                        handleManualSync();
                        setIsSyncModalOpen(false);
                      }}
                      className="space-y-3 text-xs"
                    >
                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Google Apps Script Web App URL / API:</label>
                        <input
                          name="apiUrl"
                          defaultValue={sheetConfig.apiUrl}
                          className="w-full p-2.5 border border-gray-300 rounded-xl font-mono text-[11px]"
                        />
                      </div>

                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Spreadsheet ID:</label>
                        <input
                          name="sheetId"
                          defaultValue={sheetConfig.sheetId}
                          className="w-full p-2.5 border border-gray-300 rounded-xl font-mono text-[11px]"
                        />
                      </div>

                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Sheet Tab Name:</label>
                        <input
                          name="sheetName"
                          defaultValue={sheetConfig.sheetName}
                          className="w-full p-2.5 border border-gray-300 rounded-xl"
                        />
                      </div>

                      <div className="flex items-center gap-2 pt-1">
                        <input
                          type="checkbox"
                          name="autoSync"
                          id="autoSyncCheck"
                          defaultChecked={sheetConfig.autoSync}
                          className="w-4 h-4 text-[#2E6B47] rounded"
                        />
                        <label htmlFor="autoSyncCheck" className="text-gray-700 font-medium">
                          Auto-sync saat ada perubahan status & performa
                        </label>
                      </div>

                      <div className="flex justify-between items-center pt-3 border-t">
                        <button
                          type="button"
                          onClick={() => {
                            // Export CSV download simulation
                            const csvContent = "data:text/csv;charset=utf-8," + 
                              ["ID,Day,Title,Format,Pillar,Status,KPI"].concat(
                                contents.map(c => `"${c.id}","${c.day}","${c.title}","${c.format}","${c.pillar}","${c.status}","${c.primaryKPI}"`)
                              ).join("\n");
                            const encodedUri = encodeURI(csvContent);
                            const link = document.createElement("a");
                            link.setAttribute("href", encodedUri);
                            link.setAttribute("download", "Agarillus_Content_September_2026.csv");
                            document.body.appendChild(link);
                            link.click();
                            showToast('CSV Backup berhasil diunduh!');
                          }}
                          className="text-xs text-gray-600 hover:text-[#17432F] font-semibold underline"
                        >
                          Ekspor Backup CSV
                        </button>

                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={handleManualSync}
                            className="bg-[#F6F1E4] text-[#C99A2E] border border-[#C99A2E]/30 px-3 py-2 rounded-xl font-bold"
                          >
                            Sync Sekarang
                          </button>
                          <button
                            type="submit"
                            className="bg-[#2E6B47] hover:bg-[#17432F] text-white px-4 py-2 rounded-xl font-bold"
                          >
                            Simpan Konfigurasi
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* ==========================================
                  MODAL 4: QUICK ADD CONTENT
                  ========================================== */}
              {isAddModalOpen && (
                <div className="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
                  <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-[#E2EBE2]">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-base text-[#17432F]">Tambah Ide / Rencana Konten Baru</h3>
                      <button onClick={() => setIsAddModalOpen(false)} className="text-gray-400 hover:text-gray-600">
                        <Icon name="close" className="w-5 h-5" />
                      </button>
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        const fd = new FormData(e.target);
                        const newDay = Number(fd.get('day')) || (contents.length + 1);
                        const newObj = {
                          id: `AGR-${newDay.toString().padStart(2, '0')}`,
                          day: newDay,
                          date: fd.get('date') || `2026-09-${newDay.toString().padStart(2, '0')}`,
                          title: fd.get('title'),
                          format: fd.get('format'),
                          pillar: fd.get('pillar'),
                          funnel: fd.get('funnel'),
                          persona: fd.get('persona'),
                          platform: fd.get('platform') || 'Instagram & TikTok',
                          primaryKPI: fd.get('primaryKPI'),
                          secondaryKPI: 'Comments',
                          series: fd.get('series') || '#CekGulaJanganKiraKira',
                          hook: fd.get('hook'),
                          concept: fd.get('concept'),
                          visual: fd.get('visual'),
                          cta: fd.get('cta'),
                          caption: fd.get('hook'),
                          script: fd.get('hook'),
                          status: 'Idea',
                          tasks: { briefApproved: true, scriptDone: false, visualDone: false, editingDone: false, captionDone: false, readyToPost: false, posted: false },
                          formatTasks: {},
                          safetyChecks: { noPromiseCure: true, noStopDoctorMeds: true, noDiagnosis: true, bpomClaimMatch: true, referToDoctor: true },
                          performance: null
                        };
                        setContents(prev => [...prev, newObj]);
                        setIsAddModalOpen(false);
                        showToast(`Konten ${newObj.id} berhasil ditambahkan!`);
                      }}
                      className="space-y-3 text-xs"
                    >
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="font-bold text-[#17432F] block mb-1">Hari (Day):</label>
                          <input name="day" type="number" defaultValue={contents.length + 1} className="w-full p-2 border border-gray-300 rounded-xl" />
                        </div>
                        <div>
                          <label className="font-bold text-[#17432F] block mb-1">Tanggal Rencana:</label>
                          <input name="date" type="date" defaultValue={`2026-09-${(contents.length + 1).toString().padStart(2, '0')}`} className="w-full p-2 border border-gray-300 rounded-xl" />
                        </div>
                      </div>

                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Judul Konten:</label>
                        <input name="title" required placeholder="e.g. Mitos sarapan manis bikin lemas" className="w-full p-2.5 border border-gray-300 rounded-xl" />
                      </div>

                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="font-bold text-[#17432F] block mb-1">Format:</label>
                          <select name="format" className="w-full p-2 border border-gray-300 rounded-xl">
                            <option value="VIDEO">VIDEO</option>
                            <option value="CAROUSEL">CAROUSEL</option>
                            <option value="SINGLE POST">SINGLE POST</option>
                          </select>
                        </div>
                        <div>
                          <label className="font-bold text-[#17432F] block mb-1">Pillar:</label>
                          <select name="pillar" className="w-full p-2 border border-gray-300 rounded-xl">
                            <option value="Problem / Relatable">Relatable / Problem</option>
                            <option value="Simple Education">Simple Education</option>
                            <option value="Trust & Authority">Trust & Authority</option>
                            <option value="Soft Offer">Soft Offer</option>
                          </select>
                        </div>
                        <div>
                          <label className="font-bold text-[#17432F] block mb-1">Primary KPI:</label>
                          <select name="primaryKPI" className="w-full p-2 border border-gray-300 rounded-xl">
                            <option value="Views">Views</option>
                            <option value="Comments">Comments</option>
                            <option value="Shares">Shares</option>
                            <option value="Saves">Saves</option>
                            <option value="Profile Visit">Profile Visit</option>
                            <option value="Trust">Trust</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Hook (Teks 2 Detik Pertama):</label>
                        <input name="hook" required placeholder="“Masih mikir sarapan ini aman buat gula darah?”" className="w-full p-2.5 border border-gray-300 rounded-xl" />
                      </div>

                      <div>
                        <label className="font-bold text-[#17432F] block mb-1">Konsep & Pesan Edukasi:</label>
                        <textarea name="concept" rows={2} placeholder="Jelaskan secara ringkas tanpa klaim medis ekstrem..." className="w-full p-2.5 border border-gray-300 rounded-xl" />
                      </div>

                      <div className="flex justify-end gap-2 pt-3 border-t">
                        <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2 rounded-xl text-gray-600 font-semibold">
                          Batal
                        </button>
                        <button type="submit" className="bg-[#2E6B47] hover:bg-[#17432F] text-white px-5 py-2 rounded-xl font-bold">
                          Simpan Konten
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* FOOTER */}
              <footer className="mt-12 border-t border-[#E2EBE2] bg-white text-gray-600 py-6 text-xs">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-[#17432F]">AGARILLUS CONTENT HUB</span>
                    <span className="text-gray-400">|</span>
                    <span>Social Media Growth & Production Management</span>
                  </div>

                  <div className="flex items-center gap-4 text-[11px]">
                    <span>Last Sync: <strong>{sheetConfig.lastSynced}</strong></span>
                    <span className="flex items-center gap-1.5 text-emerald-700 font-semibold">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                      Google Sheets: CONNECTED
                    </span>
                  </div>
                </div>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
